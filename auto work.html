<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Surprise 😂</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#111;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#start{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  padding:20px 35px;
  border:0;
  border-radius:15px;
  font-size:22px;
  font-weight:bold;
}

#area{
  display:none;
  width:100vw;
  height:100vh;
  position:relative;
}

.tab{
  position:absolute;
  width:90%;
  height:80%;
  left:5%;
  top:10%;
  background:white;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  box-shadow:0 0 25px #000;
  animation:pop .15s;
}

.face{
  font-size:min(55vw,55vh);
  line-height:1;
}

.number{
  font-size:20px;
  font-weight:bold;
}

@keyframes pop{
  from{transform:scale(.8);opacity:0}
  to{transform:scale(1);opacity:1}
}

#counter{
  position:fixed;
  top:10px;
  left:10px;
  z-index:9999;
  background:#000;
  color:#fff;
  padding:8px 12px;
  border-radius:8px;
  font-weight:bold;
}
</style>
</head>

<body>

<button id="start">TAP HERE 😂</button>

<div id="area">
  <div id="counter">0 / 100</div>
</div>

<script>
const start=document.getElementById("start");
const area=document.getElementById("area");
const counter=document.getElementById("counter");

let n=0;
let timer;

start.onclick=function(){

  start.style.display="none";
  area.style.display="block";

  timer=setInterval(function(){

    n++;

    const tab=document.createElement("div");
    tab.className="tab";

    tab.innerHTML=
      '<div class="face">🖕</div>'+
      '<div class="number">Fake Tab '+n+' / 100</div>';

    area.appendChild(tab);

    counter.textContent=n+" / 100";

    while(area.querySelectorAll(".tab").length>5){
      area.querySelector(".tab").remove();
    }

    if(n>=100){
      clearInterval(timer);
      counter.textContent="😂 PRANK COMPLETE!";
    }

  },100);
};
</script>

</body>
</html>
